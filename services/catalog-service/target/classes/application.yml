spring:
  application:
    name: catalog-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_platform}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  flyway:
    enabled: false

app:
  api:
    version-prefix: ${API_VERSION_PREFIX:/api/v1}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    root: INFO
