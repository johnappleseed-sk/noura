spring:
  application:
    name: checkout-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_platform}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_checkout_service
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    fail-on-missing-locations: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

services:
  cart:
    base-url: ${CART_SERVICE_BASE_URL:http://localhost:8088}
  customer:
    base-url: ${CUSTOMER_SERVICE_BASE_URL:http://localhost:8089}
    internal-api-key: ${CUSTOMER_SERVICE_INTERNAL_API_KEY:}
  pricing:
    base-url: ${PRICING_SERVICE_BASE_URL:http://localhost:8087}
  inventory:
    base-url: ${INVENTORY_SERVICE_BASE_URL:http://localhost:8086}
  order:
    base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8090}
    internal-api-key: ${ORDER_SERVICE_INTERNAL_API_KEY:}
  payment:
    base-url: ${PAYMENT_SERVICE_BASE_URL:http://localhost:8092}
  notification:
    base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://localhost:8083}
    internal-api-key: ${NOTIFICATION_SERVICE_INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
