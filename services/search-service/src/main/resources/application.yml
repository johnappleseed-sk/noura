spring:
  application:
    name: search-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_platform}
    username: ${DB_USERNAME:commerce}
    password: ${DB_PASSWORD:commerce}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_schema_history_search_service
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    fail-on-missing-locations: true

app:
  internal:
    api-key: ${APP_INTERNAL_API_KEY:}
  api:
    version-prefix: ${API_VERSION_PREFIX:/api/v1}
  search:
    provider: ${SEARCH_PROVIDER:postgres}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
