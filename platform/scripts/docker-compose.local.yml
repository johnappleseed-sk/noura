services:
  postgres:
    image: postgres:16-alpine
    container_name: noura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DEFAULT_DB:-postgres}
      APP_DB_NAME: ${APP_DB_NAME:-commerce_platform}
      APP_DB_USER: ${APP_DB_USER:-commerce}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPER_USER:-postgres} -d ${POSTGRES_DEFAULT_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: noura-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.8
    container_name: noura-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: noura-keycloak
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-adminadmin}
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  app-service:
    build:
      context: ../../archive/legacy-monolith/backend-monolith
      dockerfile: Dockerfile
    image: noura-app-service:local
    container_name: noura-app-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-commerce_platform}
      DB_USERNAME: ${APP_DB_USER:-commerce}
      DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${APP_JWT_SECRET:-dev-super-secret-change-me-please-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:8080}
      APP_AUTH_SSO_ENABLED: "false"
      APP_NOTIFICATIONS_REMOTE_ENABLED: ${APP_NOTIFICATIONS_REMOTE_ENABLED:-true}
      APP_NOTIFICATIONS_REMOTE_BASE_URL: ${APP_NOTIFICATIONS_REMOTE_BASE_URL:-http://notification-service:8080}
      APP_NOTIFICATIONS_REMOTE_COMMAND_PATH: ${APP_NOTIFICATIONS_REMOTE_COMMAND_PATH:-/internal/notifications}
      APP_NOTIFICATIONS_REMOTE_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:-}
      APP_NOTIFICATIONS_REMOTE_FALLBACK_LOCAL: ${APP_NOTIFICATIONS_REMOTE_FALLBACK_LOCAL:-true}
    ports:
      - "${APP_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notification-service:
        condition: service_healthy

  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    image: noura-notification-service:local
    container_name: noura-notification-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-commerce_platform}
      DB_USERNAME: ${APP_DB_USER:-commerce}
      DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
      APP_INTERNAL_API_KEY: ${NOTIFICATION_INTERNAL_API_KEY:-}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog-service:
    build:
      context: ../../services/catalog-service
      dockerfile: Dockerfile
    image: noura-catalog-service:local
    container_name: noura-catalog-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-commerce_platform}
      DB_USERNAME: ${APP_DB_USER:-commerce}
      DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
      API_VERSION_PREFIX: /api/v1
    ports:
      - "${CATALOG_SERVICE_PORT:-8084}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  search-service:
    build:
      context: ../../services/search-service
      dockerfile: Dockerfile
    image: noura-search-service:local
    container_name: noura-search-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-commerce_platform}
      DB_USERNAME: ${APP_DB_USER:-commerce}
      DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
      API_VERSION_PREFIX: /api/v1
    ports:
      - "${SEARCH_SERVICE_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  inventory-service:
    build:
      context: ../../services/inventory-service
      dockerfile: Dockerfile
    image: noura-inventory-service:local
    container_name: noura-inventory-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-commerce_platform}
      DB_USERNAME: ${APP_DB_USER:-commerce}
      DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
    ports:
      - "${INVENTORY_SERVICE_PORT:-8086}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  pricing-service:
    build:
      context: ../../services/pricing-service
      dockerfile: Dockerfile
    image: noura-pricing-service:local
    container_name: noura-pricing-service
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${APP_DB_NAME:-commerce_platform}
      DB_USERNAME: ${APP_DB_USER:-commerce}
      DB_PASSWORD: ${APP_DB_PASSWORD:-commerce}
    ports:
      - "${PRICING_SERVICE_PORT:-8087}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway:
    build:
      context: ../../apps/api-gateway
      dockerfile: Dockerfile
    image: noura-edge-gateway:local
    container_name: noura-edge-gateway
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      APP_SERVICE_URL: http://app-service:8080
      CATALOG_SERVICE_URL: http://catalog-service:8080
      SEARCH_SERVICE_URL: http://search-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      PRICING_SERVICE_URL: http://pricing-service:8080
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-noura}
      GATEWAY_AUTH_ENABLED: ${GATEWAY_AUTH_ENABLED:-false}
      GATEWAY_FORWARD_CLAIMS: ${GATEWAY_FORWARD_CLAIMS:-true}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      app-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      search-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      pricing-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  kafka_data:
