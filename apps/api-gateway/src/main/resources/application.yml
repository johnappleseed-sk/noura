spring:
  application:
    name: edge-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      x-forwarded:
        enabled: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - RemoveRequestHeader=Cookie
      routes:
        - id: search-service-legacy-search
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Method=GET
            - Path=/api/search/**
          filters:
            - RewritePath=/api/search/(?<segment>.*), /api/v1/search/${segment}
            - PreserveHostHeader
        - id: catalog-service-admin-search-legacy
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Method=GET
            - Path=/api/admin/products/search
          filters:
            - RewritePath=/api/admin/products/search, /api/v1/admin/products/search
            - PreserveHostHeader
        - id: catalog-service-admin-products-search
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Method=GET
            - Path=/api/v1/admin/products/search
          filters:
            - PreserveHostHeader
        - id: catalog-service-product-list-search
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Method=GET
            - Path=/api/v1/products,/api/v1/products/search
          filters:
            - PreserveHostHeader
        - id: catalog-service-product-detail
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Method=GET
            - Path=/api/v1/products/{productId}
          filters:
            - PreserveHostHeader
        - id: catalog-service-product-inventory
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Method=GET
            - Path=/api/v1/products/{productId}/inventory
          filters:
            - PreserveHostHeader
        - id: search-service
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Method=GET
            - Path=/api/v1/search/**
          filters:
            - PreserveHostHeader
        - id: catalog-service-categories-tree
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Method=GET
            - Path=/api/v1/categories/tree
          filters:
            - PreserveHostHeader
        - id: catalog-service-health
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/internal/catalog-service/health
          filters:
            - RewritePath=/internal/catalog-service/health, /actuator/health
        - id: catalog-service-readiness
          uri: ${CATALOG_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/internal/catalog-service/readiness
          filters:
            - RewritePath=/internal/catalog-service/readiness, /actuator/health/readiness
        - id: search-service-health
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/internal/search-service/health
          filters:
            - RewritePath=/internal/search-service/health, /actuator/health
        - id: search-service-readiness
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/internal/search-service/readiness
          filters:
            - RewritePath=/internal/search-service/readiness, /actuator/health/readiness
        - id: notification-service-api
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - PreserveHostHeader
        - id: notification-service-api-legacy
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications/(?<segment>.*), /api/v1/notifications/${segment}
            - PreserveHostHeader
        - id: inventory-service-stock-levels
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Method=GET,POST
            - Path=/api/inventory/v1/stock-levels,/api/inventory/v1/stock-levels/**
          filters:
            - PreserveHostHeader
        - id: inventory-service-adjustments-compat
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Method=POST
            - Path=/api/inventory/v1/movements/adjustments
          filters:
            - PreserveHostHeader
        - id: inventory-service-health
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/internal/inventory-service/health
          filters:
            - RewritePath=/internal/inventory-service/health, /actuator/health
        - id: inventory-service-readiness
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/internal/inventory-service/readiness
          filters:
            - RewritePath=/internal/inventory-service/readiness, /actuator/health/readiness
        - id: pricing-service-api
          uri: ${PRICING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Method=GET,POST,PUT
            - Path=/api/pricing/v1/**,/api/pricing/v1
          filters:
            - PreserveHostHeader
        - id: promotion-service-api
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8094}
          predicates:
            - Method=GET,POST,PATCH,DELETE
            - Path=/api/v1/promotions,/api/v1/promotions/**,/api/promotions,/api/promotions/**,/api/v1/admin/promotions,/api/v1/admin/promotions/**,/api/admin/promotions,/api/admin/promotions/**
          filters:
            - PreserveHostHeader
        - id: promotion-service-health
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/internal/promotion-service/health
          filters:
            - RewritePath=/internal/promotion-service/health, /actuator/health
        - id: promotion-service-readiness
          uri: ${PROMOTION_SERVICE_URL:http://localhost:8094}
          predicates:
            - Path=/internal/promotion-service/readiness
          filters:
            - RewritePath=/internal/promotion-service/readiness, /actuator/health/readiness
        - id: pricing-service-health
          uri: ${PRICING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/internal/pricing-service/health
          filters:
            - RewritePath=/internal/pricing-service/health, /actuator/health
        - id: pricing-service-readiness
          uri: ${PRICING_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/internal/pricing-service/readiness
          filters:
            - RewritePath=/internal/pricing-service/readiness, /actuator/health/readiness
        - id: cart-service-api
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Method=GET,POST,PUT,PATCH,DELETE
            - Path=/api/v1/cart,/api/v1/cart/**,/api/cart,/api/cart/**
          filters:
            - PreserveHostHeader
        - id: cart-service-health
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/internal/cart-service/health
          filters:
            - RewritePath=/internal/cart-service/health, /actuator/health
        - id: cart-service-readiness
          uri: ${CART_SERVICE_URL:http://localhost:8088}
          predicates:
            - Path=/internal/cart-service/readiness
          filters:
            - RewritePath=/internal/cart-service/readiness, /actuator/health/readiness
        - id: customer-service-account
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Method=GET,POST,PUT,DELETE
            - Path=/api/v1/account/profile,/api/v1/account/addresses,/api/v1/account/addresses/**,/api/account/profile,/api/account/addresses,/api/account/addresses/**
          filters:
            - PreserveHostHeader
        - id: customer-service-health
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/internal/customer-service/health
          filters:
            - RewritePath=/internal/customer-service/health, /actuator/health
        - id: customer-service-readiness
          uri: ${CUSTOMER_SERVICE_URL:http://localhost:8089}
          predicates:
            - Path=/internal/customer-service/readiness
          filters:
            - RewritePath=/internal/customer-service/readiness, /actuator/health/readiness
        - id: order-service-orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8090}
          predicates:
            - Method=GET,POST,PATCH
            - Path=/api/v1/orders,/api/v1/orders/**,/api/orders,/api/orders/**
          filters:
            - PreserveHostHeader
        - id: order-service-account-orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8090}
          predicates:
            - Method=GET
            - Path=/api/v1/account/orders,/api/account/orders
          filters:
            - PreserveHostHeader
        - id: order-service-health
          uri: ${ORDER_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/internal/order-service/health
          filters:
            - RewritePath=/internal/order-service/health, /actuator/health
        - id: order-service-readiness
          uri: ${ORDER_SERVICE_URL:http://localhost:8090}
          predicates:
            - Path=/internal/order-service/readiness
          filters:
            - RewritePath=/internal/order-service/readiness, /actuator/health/readiness
        - id: checkout-service-api
          uri: ${CHECKOUT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Method=POST
            - Path=/api/v1/checkout,/api/v1/checkout/preview,/api/v1/checkout/validate,/api/v1/checkout/place-order,/api/checkout,/api/checkout/preview,/api/checkout/validate,/api/checkout/place-order
          filters:
            - PreserveHostHeader
        - id: checkout-service-health
          uri: ${CHECKOUT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/internal/checkout-service/health
          filters:
            - RewritePath=/internal/checkout-service/health, /actuator/health
        - id: checkout-service-readiness
          uri: ${CHECKOUT_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/internal/checkout-service/readiness
          filters:
            - RewritePath=/internal/checkout-service/readiness, /actuator/health/readiness
        - id: app-service
          uri: ${APP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/**,/swagger-ui/**,/v3/api-docs/**,/uploads/**
          filters:
            - PreserveHostHeader
        - id: notification-service-internal
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/internal/notifications/**
          filters:
            - PreserveHostHeader
        - id: notification-service-health
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/internal/notification-service/health
          filters:
            - RewritePath=/internal/notification-service/health, /actuator/health
        - id: notification-service-readiness
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/internal/notification-service/readiness
          filters:
            - RewritePath=/internal/notification-service/readiness, /actuator/health/readiness
        - id: app-service-health
          uri: ${APP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/internal/app/health
          filters:
            - RewritePath=/internal/app/health, /actuator/health
        - id: app-service-readiness
          uri: ${APP_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/internal/app/readiness
          filters:
            - RewritePath=/internal/app/readiness, /actuator/health/readiness
        - id: keycloak
          uri: ${KEYCLOAK_URL:http://localhost:18080}
          predicates:
            - Path=/keycloak/**
          filters:
            - RewritePath=/keycloak/?(?<segment>.*), /${segment}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/noura}

gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:false}
    forward-claims: ${GATEWAY_FORWARD_CLAIMS:true}
    subject-header: ${GATEWAY_SUBJECT_HEADER:X-Auth-Subject}
    username-header: ${GATEWAY_USERNAME_HEADER:X-Auth-Username}
    roles-header: ${GATEWAY_ROLES_HEADER:X-Auth-Roles}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: INFO
