  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:18080/realms/noura}

gateway:
  auth:
    enabled: ${GATEWAY_AUTH_ENABLED:false}
    forward-claims: ${GATEWAY_FORWARD_CLAIMS:true}
    subject-header: ${GATEWAY_SUBJECT_HEADER:X-Auth-Subject}
    username-header: ${GATEWAY_USERNAME_HEADER:X-Auth-Username}
    roles-header: ${GATEWAY_ROLES_HEADER:X-Auth-Roles}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,ping
        liveness:
          include: livenessState,ping
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
