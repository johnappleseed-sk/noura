spring:
  application:
    name: edge-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      forwarded:
        enabled: ${GATEWAY_FORWARDED_HEADERS_ENABLED:false}
      x-forwarded:
        enabled: ${GATEWAY_X_FORWARDED_ENABLED:false}
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - RemoveRequestHeader=Cookie
      routes:
        - id: search-service-legacy-search
          uri: ${SEARCH_SERVICE_URL:http://localhost:8085}
          predicates:
            - Method=GET
            - Path=/api/search/**
          filters:
            - RewritePath=/api/search/(?<segment>.*), /api/v1/search/${segment}
            - PreserveHostHeader
